name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # .dev.vars is gitignored and only exists locally. wrangler types reads
      # it to add DASHBOARD_USERNAME/DASHBOARD_PASSWORD to the generated Env
      # type, and the test suite reads the same file for its own throwaway
      # credentials — without it, both typecheck and the tests break in CI.
      - name: Create .dev.vars for CI
        run: |
          echo "DASHBOARD_USERNAME=ci-admin" >> .dev.vars
          echo "DASHBOARD_PASSWORD=ci-password" >> .dev.vars

      # worker-configuration.d.ts is gitignored (regenerated from
      # wrangler.jsonc) but test/tsconfig.json needs it for typed bindings.
      - name: Generate Cloudflare types
        run: npm run cf-typegen

      - name: Typecheck (src)
        run: npx tsc --noEmit

      - name: Typecheck (test)
        run: npx tsc --noEmit -p test/tsconfig.json

      - name: Test
        run: pnpm test

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --minify
